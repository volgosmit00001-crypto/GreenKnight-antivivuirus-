<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenKnight — Веб-антивирус</title>
    <style>
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #061812; color: #e2f5ee;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px; user-select: none;
        }
        .app {
            background: #0d2b21; border: 2px solid #00a88e;
            border-radius: 16px; padding: 22px; width: 100%; max-width: 440px;
            box-shadow: 0 0 25px rgba(0, 168, 142, 0.4);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { color: #34d399; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; font-size: 11px; padding: 4px 8px; border-radius: 12px; }
        .bar-bg { background: #071e17; height: 14px; border-radius: 8px; overflow: hidden; margin: 12px 0; border: 1px solid #00a88e; }
        .bar-fill { background: #00a88e; height: 100%; width: 0%; transition: width 0.2s; }
        .log {
            background: #04110d; border: 1px solid #134e4a; border-radius: 10px;
            padding: 12px; height: 150px; overflow-y: auto; font-family: monospace;
            font-size: 13px; color: #a7f3d0; margin-bottom: 14px;
        }
        .btns { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: bold; font-size: 14px; cursor: pointer; color: white;
        }
        .btn-scan { background: #00a88e; }
        .btn-quar { background: #dc2626; }
        .btn-rest { background: #2563eb; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="app">
        <div class="header">
            <h1>🛡️ GreenKnight</h1>
            <span class="badge">BETA v1.0</span>
        </div>
        <div id="status">Система готова к проверке</div>
        <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
        <div class="log" id="log">[OK] Ядро GreenKnight загружено.<br>Нажмите «Проверить» для старта.</div>
        <div class="btns">
            <button class="btn-scan" id="scanBtn" onclick="startScan()">▶ Проверить</button>
            <button class="btn-quar" id="quarBtn" onclick="toQuarantine()" disabled>🔒 В карантин</button>
            <button class="btn-rest" id="restBtn" onclick="restoreFiles()" disabled>♻️ Восстановить</button>
        </div>
    </div>

    <script>
        let threats = [];
        let quarantine = [];
        const logBox = document.getElementById("log");
        const bar = document.getElementById("bar");
        const status = document.getElementById("status");

        function addLog(text, col = "#a7f3d0") {
            logBox.innerHTML += `<div style="color:${col}; margin-top:4px;">${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function startScan() {
            document.getElementById("scanBtn").disabled = true;
            document.getElementById("quarBtn").disabled = true;
            threats = [];
            let pct = 0;
            logBox.innerHTML = "";
            addLog("🔍 Запуск полного сканирования...");

            const timer = setInterval(() => {
                pct += 10;
                bar.style.width = pct + "%";
                status.innerText = `Проверка файлов... ${pct}%`;

                if (pct === 30) {
                    threats.push("Trojan.FreeMine.exe");
                    addLog("⚠️ Найдена угроза: Trojan.FreeMine.exe", "#fca5a5");
                }
                if (pct === 70) {
                    threats.push("Adware.PirateLauncher.dll");
                    addLog("⚠️ Найдена угроза: Adware.PirateLauncher.dll", "#fca5a5");
                }
                if (pct >= 100) {
                    clearInterval(timer);
                    status.innerText = `Проверка завершена! Угроз: ${threats.length}`;
                    addLog("✅ Сканирование окончено.", "#34d399");
                    document.getElementById("scanBtn").disabled = false;
                    if (threats.length > 0) document.getElementById("quarBtn").disabled = false;
                }
            }, 250);
        }

        function toQuarantine() {
            quarantine = quarantine.concat(threats);
            addLog(`🔒 В карантин отправлено файлов: ${threats.length}`, "#fde047");
            threats = [];
            status.innerText = "Все угрозы изолированы в карантине!";
            document.getElementById("quarBtn").disabled = true;
            document.getElementById("restBtn").disabled = false;
        }

        function restoreFiles() {
            addLog(`♻️ Восстановлено из карантина: ${quarantine.join(", ")}`, "#93c5fd");
            quarantine = [];
            status.innerText = "Файлы восстановлены из карантина.";
            document.getElementById("restBtn").disabled = true;
        }
    </script>
</body>
</html>
