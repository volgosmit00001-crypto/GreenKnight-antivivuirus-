name: Build GreenKnight
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --only-binary=:all: kivy pyinstaller
      - run: pyinstaller --onefile --noconsole --name GreenKnight GreenKnight.py
      - uses: actions/upload-artifact@v4
        with:
          name: GreenKnight-Windows
          path: dist/GreenKnight.exe
